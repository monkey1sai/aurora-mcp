<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURORA Jam — 自動演奏測試頁</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/jam.css">
<style>
  html, body { overflow: auto; height: auto; min-height: 100%; }
  .page { max-width: 1320px; margin: 0 auto; padding: 22px 22px 60px; display: grid; gap: 16px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
  .top h1 { margin: 0; font-size: 20px; letter-spacing: .12em; font-weight: 700; }
  .top h1 span { background: var(--grad-aurora); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .top p { margin: 0; color: var(--text-dim); font-size: 12.5px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-left: auto; }
  .bar select { height: 34px; border-radius: 10px; border: 0; padding: 0 10px; color: var(--text); background: rgba(8, 10, 18, .7); box-shadow: inset 0 0 0 1px var(--line); font: inherit; }
  .bar button { height: 34px; border-radius: 10px; border: 0; padding: 0 14px; cursor: pointer; font: 600 12.5px inherit; font-family: inherit; color: #061018; background: var(--grad-aurora); }
  .bar .status { font-size: 12px; color: var(--text-dim); min-width: 150px; }
  .card { position: relative; padding: 16px 18px 18px; border-radius: 18px; background: linear-gradient(180deg, rgba(26, 32, 52, .7), rgba(14, 17, 29, .74)); box-shadow: inset 0 0 0 1px var(--glass-border), 0 14px 36px rgba(0, 0, 0, .32); }
  .kbd { height: 120px; }
  .splash { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(5, 7, 12, .72); backdrop-filter: blur(6px); cursor: pointer; }
  .splash div { text-align: center; }
  .splash b { display: block; font-size: 26px; letter-spacing: .2em; margin-bottom: 8px; }
  .splash span { color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>
<div class="splash" id="splash"><div><b>AURORA JAM</b><span>點一下開始 · Tap to start audio</span></div></div>
<main class="page">
  <header class="top">
    <h1><span>AURORA</span> 極光 · 自動演奏 Jam</h1>
    <p>獨立測試頁：選一個音色當主角，按 ▶ 讓 AURORA 即興伴奏 · standalone test page</p>
    <div class="bar">
      <label for="preset" class="status">你的音色 Your preset</label>
      <select id="preset" aria-label="Preset"></select>
      <span class="status" id="status">—</span>
    </div>
  </header>
  <section class="card" id="host"></section>
  <section class="card"><div class="kbd" id="kbd"></div></section>
</main>
<script type="module">
  import { createAudio, createNullAudio } from '../src/ui/audio.js';
  import { createStore } from '../src/ui/app/store.js';
  import { PRESETS, CATEGORIES } from '../src/presets/index.js';
  import { createJamPanel } from '../src/ui/demo/jam.js';

  let audio = createNullAudio();
  const store = createStore();
  store.attach({ setParam: (id, v) => audio.setParam(id, v), setParams: o => audio.setParams(o), loadPatch: p => audio.loadPatch(p), setMacro: (i, v) => audio.setMacro(i, v) });
  // audio-shaped proxy: always forwards to the current engine, keeps onState subscriptions across the swap
  const subs = new Set();
  const live = new Proxy({}, {
    get(_, k) {
      if (k === 'onState') return cb => { subs.add(cb); return () => subs.delete(cb); };
      const v = audio[k];
      return typeof v === 'function' ? v.bind(audio) : v;
    },
  });

  const sel = document.getElementById('preset');
  for (const c of CATEGORIES) {
    const g = document.createElement('optgroup');
    g.label = `${c.zh} ${c.label}`;
    for (const p of PRESETS.filter(x => x.category === c.id)) { const o = document.createElement('option'); o.value = p.name; o.textContent = p.name; g.append(o); }
    sel.append(g);
  }
  const start = new URLSearchParams(location.search).get('preset') || 'Moonlit Suitcase';
  const load = name => { const p = PRESETS.find(x => x.name === name) || PRESETS[0]; sel.value = p.name; store.loadPreset(p, { key: p.name }); };
  load(start);
  sel.addEventListener('change', () => load(sel.value));

  const jam = createJamPanel({ store, audio: live, presets: PRESETS, categories: CATEGORIES });
  document.getElementById('host').append(jam.el);
  window.jam = jam; window.store = store;
  window.getAudio = () => audio;

  const status = document.getElementById('status');
  async function boot() {
    document.getElementById('splash').remove();
    try {
      audio = await createAudio();
      store.attach({ setParam: (id, v) => audio.setParam(id, v), setParams: o => audio.setParams(o), loadPatch: p => audio.loadPatch(p), setMacro: (i, v) => audio.setMacro(i, v) });
      audio.onState(s => { for (const fn of subs) fn(s); const ss = s && s.song; status.textContent = ss && ss.playing ? `▶ ${ss.zh || ss.title} · beat ${ss.beat.toFixed(1)}` : '■'; });
      status.textContent = 'audio ready';
    } catch (e) {
      console.error(e);
      status.textContent = `audio failed: ${e.message}`;
    }
  }
  document.getElementById('splash').addEventListener('click', boot, { once: true });
  window.bootAudio = boot;

  // on-screen keyboard + QWERTY for playing along
  try {
    const { createKeyboard, attachQwerty } = await import('../src/ui/keyboard.js');
    const { SCALES } = await import('../src/dsp/params.js');
    const kb = createKeyboard({ low: 48, high: 84, onNoteOn: (n, v) => audio.noteOn(n, v), onNoteOff: n => audio.noteOff(n) });
    document.getElementById('kbd').append(kb.el);
    let oct = 0;
    attachQwerty({ onNoteOn: (n, v) => audio.noteOn(n + oct * 12, v), onNoteOff: n => audio.noteOff(n + oct * 12), onOctave: d => { oct += d; } });
    const syncScale = () => { const t = store.get('scale.type'); kb.setScale(store.get('scale.root'), t && t !== 'off' ? SCALES[t] : null); };
    store.onGlobals(syncScale);
    syncScale();
  } catch (e) { console.warn('keyboard unavailable', e); }
</script>
</body>
</html>
