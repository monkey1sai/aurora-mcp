<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURORA Magic — 魔法調音測試頁</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/demo-tools.css">
<style>
  html, body { overflow: auto; height: auto; min-height: 100%; }
  .page { max-width: 1320px; margin: 0 auto; padding: 22px 22px 60px; display: grid; gap: 16px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
  .top h1 { margin: 0; font-size: 20px; letter-spacing: .12em; font-weight: 700; }
  .top h1 span { background: var(--grad-aurora); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .top p { margin: 0; color: var(--text-dim); font-size: 12.5px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
  .bar select, .bar button { height: 34px; border-radius: 10px; border: 0; padding: 0 12px; color: var(--text); background: rgba(8, 10, 18, .7); box-shadow: inset 0 0 0 1px var(--line); font: 500 12.5px var(--font-ui); cursor: pointer; }
  .bar button:disabled { opacity: .4; cursor: default; }
  .bar button.is-on { color: #061018; background: var(--grad-aurora); }
  .status { font-size: 12px; color: var(--text-dim); min-width: 120px; }
  .knobs { display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 12px 14px; border-radius: 16px; background: linear-gradient(180deg, rgba(26, 32, 52, .7), rgba(14, 17, 29, .74)); box-shadow: inset 0 0 0 1px var(--glass-border); }
  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .grid > .wide { grid-column: 1 / -1; }
  body.compact .grid { grid-template-columns: 372px; justify-content: start; }
  body.compact .grid > .wide { grid-column: auto; }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } .grid > .wide { grid-column: auto; } }
  .splash { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(5, 7, 12, .72); backdrop-filter: blur(6px); cursor: pointer; }
  .splash div { text-align: center; }
  .splash b { display: block; font-size: 26px; letter-spacing: .2em; margin-bottom: 8px; }
  .splash span { color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>
<div class="splash" id="splash"><div><b>AURORA MAGIC</b><span>點一下開始 · Tap to start audio</span></div></div>
<main class="page">
  <header class="top">
    <h1><span>AURORA</span> 極光 · 魔法調音 Magic</h1>
    <p>獨立測試頁：情緒調音、自動演化、A/B 音色變形 · standalone test page (?layout=compact → 372 px column)</p>
    <div class="bar">
      <select id="preset" aria-label="Preset"></select>
      <button id="demo" type="button">▶ 示範 Demo</button>
      <button id="undo" type="button">↶ 復原</button>
      <button id="redo" type="button">↷ 重做</button>
      <button id="lang" type="button">EN</button>
      <span class="status" id="status">—</span>
    </div>
  </header>
  <section class="knobs" id="knobs" aria-label="Bound knobs"></section>
  <div class="grid">
    <div class="wide" id="smart"></div>
    <div id="evolve"></div>
    <div id="morph"></div>
  </div>
</main>
<script type="module">
  import { createAudio, createNullAudio } from '../src/ui/audio.js';
  import { createStore } from '../src/ui/app/store.js';
  import { createBinder } from '../src/ui/app/controls.js';
  import { createScope } from '../src/ui/app/dom.js';
  import { getLang, setLang } from '../src/ui/app/i18n.js';
  import { PRESETS, CATEGORIES } from '../src/presets/index.js';
  import { getPhrase, PHRASES, DEMO_FOR_CATEGORY } from '../tools/phrases.mjs';
  import { createSmartPanel } from '../src/ui/demo/smart.js';
  import { createEvolvePanel } from '../src/ui/demo/evolve.js';
  import { createMorphPanel } from '../src/ui/demo/morph.js';

  const qs = new URLSearchParams(location.search);
  const compact = qs.get('layout') === 'compact';
  if (compact) document.body.classList.add('compact');

  let audio = createNullAudio();
  const store = createStore();
  const sink = () => ({ setParam: (id, v) => audio.setParam(id, v), setParams: o => audio.setParams(o), loadPatch: p => audio.loadPatch(p), setMacro: (i, v) => audio.setMacro(i, v) });
  store.attach(sink());
  // audio-shaped proxy: always forwards to the current engine, keeps onState subscriptions across the swap
  const stateSubs = new Set();
  const live = new Proxy({}, {
    get(_, k) {
      if (k === 'onState') return cb => { stateSubs.add(cb); return () => stateSubs.delete(cb); };
      const v = audio[k];
      return typeof v === 'function' ? v.bind(audio) : v;
    },
  });

  const sel = document.getElementById('preset');
  for (const c of CATEGORIES) {
    const g = document.createElement('optgroup');
    g.label = `${c.zh} ${c.label}`;
    for (const p of PRESETS.filter(x => x.category === c.id)) { const o = document.createElement('option'); o.value = p.name; o.textContent = p.name; g.append(o); }
    sel.append(g);
  }
  const load = name => { const p = PRESETS.find(x => x.name === name) || PRESETS[0]; sel.value = p.name; store.loadPreset(p, { key: p.name }); if (playing) playDemo(); };
  let playing = false;
  load(qs.get('preset') || 'Aurora Pad');
  sel.addEventListener('change', () => load(sel.value));

  // a strip of real bound knobs (controls.js) so tools can be seen moving the patch
  const binder = createBinder(store);
  const kScope = createScope();
  const KNOBS = [['macro1', 'var(--a-teal)'], ['macro2', 'var(--a-cyan)'], ['macro3', 'var(--a-violet)'], ['macro4', 'var(--a-pink)'],
    ['filter.cutoff', 'var(--a-violet)'], ['filter.res', 'var(--a-violet)'], ['osc1.shape', 'var(--a-cyan)'], ['osc1.detune', 'var(--a-cyan)'],
    ['aenv.a', 'var(--a-amber)'], ['aenv.r', 'var(--a-amber)'], ['chorus.mix', 'var(--a-pink)'], ['delay.mix', 'var(--a-pink)'],
    ['reverb.mix', 'var(--a-pink)'], ['reverb.size', 'var(--a-pink)'], ['eq.high', 'var(--a-pink)'], ['amp.level', 'var(--a-teal)']];
  for (const [id, acc] of KNOBS) document.getElementById('knobs').append(binder.knob(kScope, id, { size: 'sm', accent: acc }).el);

  const smart = createSmartPanel({ store, audio: live, compact });
  const evolve = createEvolvePanel({ store, audio: live, compact });
  const morph = createMorphPanel({ store, audio: live, presets: PRESETS, categories: CATEGORIES, compact });
  document.getElementById('smart').append(smart.el);
  document.getElementById('evolve').append(evolve.el);
  document.getElementById('morph').append(morph.el);
  Object.assign(window, { store, smart, evolve, morph, PRESETS, getAudio: () => audio });

  const undoB = document.getElementById('undo'), redoB = document.getElementById('redo'), status = document.getElementById('status');
  const hist = () => { undoB.disabled = !store.canUndo(); redoB.disabled = !store.canRedo(); status.textContent = `${store.getMeta().name}${store.isDirty() ? ' •' : ''}`; };
  store.onHistory(hist); store.onDirty(hist); store.onPatch(hist); hist();
  undoB.addEventListener('click', () => store.undo());
  redoB.addEventListener('click', () => store.redo());
  const langB = document.getElementById('lang');
  const syncLang = () => { langB.textContent = getLang() === 'en' ? '中' : 'EN'; };
  langB.addEventListener('click', () => { setLang(getLang() === 'en' ? 'zh' : 'en'); syncLang(); });
  syncLang();

  const demoB = document.getElementById('demo');
  function playDemo() {
    const meta = store.getMeta();
    const id = meta.demo && PHRASES[meta.demo] ? meta.demo : DEMO_FOR_CATEGORY[meta.category] || 'keys';
    audio.seqStop(); audio.seqLoad(getPhrase(id)); audio.seqPlay();
    playing = true; demoB.classList.add('is-on');
  }
  demoB.addEventListener('click', async () => {
    if (audio.isNull) await boot();
    if (playing) { audio.seqStop(); playing = false; demoB.classList.remove('is-on'); } else playDemo();
  });

  async function boot() {
    const sp = document.getElementById('splash');
    if (sp) sp.remove();
    if (!audio.isNull) return;
    try {
      audio = await createAudio();
      store.attach(sink());
      audio.onState(st => { for (const fn of stateSubs) fn(st); });
    } catch (e) { console.error(e); status.textContent = `audio failed: ${e.message}`; }
  }
  document.getElementById('splash').addEventListener('click', boot, { once: true });
  window.bootAudio = boot;
</script>
</body>
</html>
